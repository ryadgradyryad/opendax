name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # تم إضافة التوجيه للمجلد الصحيح هنا
      - name: Install dependencies
        working-directory: ./اسم_المجلد
        run: flutter pub get

      - name: Build APK
        working-directory: ./اسم_المجلد
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: اسم_المجلد/build/app/outputs/flutter-apk/app-release.apk
